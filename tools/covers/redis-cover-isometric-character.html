<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Redis Cover — Isometric Dark Tech</title>
<style>
  html, body { margin: 0; padding: 0; width: 900px; height: 383px; overflow: hidden; background: #050A12; }
  svg { display: block; width: 900px; height: 383px; }
  text { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
  .latin { font-family: "Arial Black", "Microsoft YaHei", sans-serif; }
  .mono { font-family: "Consolas", "Microsoft YaHei", monospace; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="383" viewBox="0 0 900 383">
  <defs>
    <radialGradient id="bgGlow" cx="70%" cy="50%" r="62%">
      <stop offset="0%" stop-color="#123A66" stop-opacity="0.9"/>
      <stop offset="58%" stop-color="#0A1A30" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#050A12" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4DE1FF" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#4DE1FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbCoral" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FF6B35" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#BFE9FF"/>
    </linearGradient>
    <linearGradient id="pageLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#173250"/>
      <stop offset="100%" stop-color="#0E1F35"/>
    </linearGradient>
    <linearGradient id="pageRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B3A5E"/>
      <stop offset="100%" stop-color="#102541"/>
    </linearGradient>
    <pattern id="iso" width="60" height="30" patternUnits="userSpaceOnUse">
      <path d="M0 15 L30 0 L60 15 L30 30 Z" fill="none" stroke="#14273F" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#FFFFFF" opacity="0.02"/>
    </pattern>
    <filter id="blur10" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="blur4" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="900" height="383" fill="#050A12"/>
  <rect width="900" height="383" fill="url(#bgGlow)"/>
  <rect width="900" height="383" fill="url(#iso)" opacity="0.7"/>
  <rect width="900" height="383" fill="url(#scan)"/>
  <ellipse cx="700" cy="230" rx="210" ry="150" fill="url(#orbCyan)"/>
  <ellipse cx="640" cy="320" rx="240" ry="80" fill="url(#orbCoral)"/>

  <!-- particles -->
  <g fill="#9FE9FF">
    <circle cx="470" cy="60" r="1.6" opacity="0.8"/><circle cx="520" cy="150" r="1.2" opacity="0.5"/>
    <circle cx="872" cy="110" r="1.5" opacity="0.6"/><circle cx="452" cy="330" r="1.2" opacity="0.5"/>
  </g>

  <!-- badge -->
  <rect x="56" y="42" width="232" height="34" rx="17" fill="#0B1626" stroke="#4DE1FF" stroke-width="1.5"/>
  <circle cx="74" cy="59" r="4" fill="#4DE1FF"/>
  <circle cx="74" cy="59" r="8" fill="#4DE1FF" opacity="0.18"/>
  <text x="90" y="65" font-size="14" font-weight="600" fill="#9FE9FF" letter-spacing="0.5">AI 项目经理视角 · 技术科普</text>

  <!-- title -->
  <text x="56" y="160" class="latin" font-size="96" font-weight="900" fill="#4DE1FF" opacity="0.42" filter="url(#blur10)" letter-spacing="2">REDIS</text>
  <text x="60" y="166" class="latin" font-size="96" font-weight="900" fill="#FF6B35" opacity="0.95" letter-spacing="2">REDIS</text>
  <text x="54" y="160" class="latin" font-size="96" font-weight="900" fill="url(#titleFill)" letter-spacing="2">REDIS</text>

  <!-- subtitle -->
  <g transform="rotate(-2 50 184)">
    <rect x="50" y="184" width="206" height="50" rx="7" fill="#0E1B2E" stroke="#FF6B35" stroke-width="2.5"/>
    <rect x="50" y="184" width="206" height="50" rx="7" fill="#FF6B35" opacity="0.22" filter="url(#blur10)"/>
    <text x="70" y="219" font-size="30" font-weight="800" fill="#FFF3E8" letter-spacing="1">不是硬盘</text>
  </g>

  <!-- tagline -->
  <text x="56" y="278" font-size="20" font-weight="500" fill="#B9CBE3" letter-spacing="0.5">住在内存里的万能小本本</text>

  <!-- chips -->
  <g font-size="14" font-weight="700" fill="#8FE3FF">
    <rect x="56" y="304" width="70" height="28" rx="14" fill="#0B1626" stroke="#24486E" stroke-width="1.5"/>
    <text x="77" y="323">缓存</text>
    <rect x="136" y="304" width="70" height="28" rx="14" fill="#0B1626" stroke="#24486E" stroke-width="1.5"/>
    <text x="157" y="323">限流</text>
    <rect x="216" y="304" width="70" height="28" rx="14" fill="#0B1626" stroke="#24486E" stroke-width="1.5"/>
    <text x="237" y="323">会话</text>
  </g>

  <!-- brand -->
  <text x="56" y="368" font-size="12" fill="#5E7595" letter-spacing="1">黑胶先生 · 把技术讲成人话</text>

  <!-- ================= isometric illustration ================= -->

  <!-- glow under book -->
  <ellipse cx="690" cy="334" rx="190" ry="46" fill="#4DE1FF" opacity="0.16" filter="url(#blur10)"/>
  <ellipse cx="690" cy="334" rx="130" ry="30" fill="#FF6B35" opacity="0.08" filter="url(#blur10)"/>

  <!-- data streams -->
  <g fill="none" stroke="#4DE1FF" stroke-width="1.6" stroke-dasharray="3 7" opacity="0.55">
    <path d="M446 128 C 486 116, 512 148, 540 196"/>
    <path d="M462 84 C 508 74, 536 110, 566 152"/>
  </g>
  <g>
    <rect x="436" y="118" width="22" height="16" rx="3" fill="#0B1626" stroke="#4DE1FF" stroke-width="2" transform="rotate(-8 436 118)"/>
    <text x="447" y="129" font-size="9" font-weight="700" fill="#9FE9FF" text-anchor="middle" class="mono">读</text>
    <rect x="452" y="76" width="20" height="15" rx="3" fill="#0B1626" stroke="#FF6B35" stroke-width="2" transform="rotate(6 452 76)"/>
    <text x="462" y="87" font-size="9" font-weight="700" fill="#FFB08A" text-anchor="middle" class="mono">写</text>
    <circle cx="540" cy="196" r="3" fill="#4DE1FF"/>
    <circle cx="566" cy="152" r="3" fill="#FF6B35"/>
  </g>

  <!-- book covers (thickness) -->
  <polygon points="520,300 690,335 690,347 520,312" fill="#08111F" stroke="#2A5A7E" stroke-width="1.5"/>
  <polygon points="690,335 860,300 860,312 690,347" fill="#0A1524" stroke="#2A5A7E" stroke-width="1.5"/>

  <!-- book pages -->
  <polygon points="520,250 690,285 690,335 520,300" fill="url(#pageLeft)" stroke="#4DE1FF" stroke-width="2"/>
  <polygon points="690,285 860,250 860,300 690,335" fill="url(#pageRight)" stroke="#4DE1FF" stroke-width="2"/>

  <!-- page lines -->
  <g stroke="#1C3A5C" stroke-width="1.2" opacity="0.7">
    <path d="M542 262 L680 290"/><path d="M536 274 L676 302"/><path d="M530 286 L672 314"/>
    <path d="M700 290 L838 262"/><path d="M704 302 L844 274"/><path d="M708 314 L848 286"/>
  </g>

  <!-- spine -->
  <path d="M690 285 L690 335" stroke="#4DE1FF" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M690 285 L690 335" stroke="#BFF4FF" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/>
  <circle cx="690" cy="285" r="4" fill="#4DE1FF"/>
  <circle cx="690" cy="285" r="10" fill="#4DE1FF" opacity="0.18"/>

  <!-- bookmark -->
  <path d="M690 335 L690 362 L682 353 L674 362 L674 335 Z" fill="#FF6B35" stroke="#0A1220" stroke-width="1.5"/>
  <path d="M682 345 L682 356" stroke="#FFD166" stroke-width="2" stroke-linecap="round"/>

  <!-- floating data cards -->
  <g>
    <!-- card 1: 缓存 -->
    <ellipse cx="561" cy="210" rx="40" ry="24" fill="#FFD166" opacity="0.16" filter="url(#blur10)"/>
    <g transform="rotate(-6 561 210)">
      <rect x="530" y="190" width="62" height="40" rx="6" fill="#141C2B" stroke="#FFD166" stroke-width="2.5"/>
      <path d="M536 200 L542 196 L548 200 L542 204 Z" fill="#FFD166"/>
      <text x="561" y="217" font-size="15" font-weight="800" fill="#FFD166" text-anchor="middle">缓存</text>
    </g>
    <path d="M560 230 L576 266" stroke="#FFD166" stroke-width="1.5" stroke-dasharray="2 4"/>

    <!-- card 2: 会话 -->
    <ellipse cx="636" cy="180" rx="40" ry="24" fill="#4DE1FF" opacity="0.14" filter="url(#blur10)"/>
    <g transform="rotate(3 636 180)">
      <rect x="605" y="160" width="62" height="40" rx="6" fill="#141C2B" stroke="#4DE1FF" stroke-width="2.5"/>
      <circle cx="616" cy="170" r="4" fill="none" stroke="#4DE1FF" stroke-width="1.8"/>
      <path d="M610 179 Q616 175 622 179" fill="none" stroke="#4DE1FF" stroke-width="1.8" stroke-linecap="round"/>
      <text x="636" y="187" font-size="15" font-weight="800" fill="#8FE3FF" text-anchor="middle">会话</text>
    </g>
    <path d="M638 200 L642 272" stroke="#4DE1FF" stroke-width="1.5" stroke-dasharray="2 4"/>

    <!-- card 3: 排行榜 -->
    <ellipse cx="592" cy="140" rx="44" ry="24" fill="#FF8FAB" opacity="0.14" filter="url(#blur10)"/>
    <g transform="rotate(-3 592 140)">
      <rect x="557" y="120" width="70" height="40" rx="6" fill="#141C2B" stroke="#FF8FAB" stroke-width="2.5"/>
      <path d="M568 146 L568 136 M576 146 L576 130 M584 146 L584 140" stroke="#FF8FAB" stroke-width="2.5" stroke-linecap="round"/>
      <text x="605" y="147" font-size="14" font-weight="800" fill="#FFB3C6" text-anchor="middle">排行榜</text>
    </g>
    <path d="M590 160 L604 246" stroke="#FF8FAB" stroke-width="1.5" stroke-dasharray="2 4"/>
  </g>

  <!-- character: memory steward -->
  <g>
    <!-- pen in right hand -->
    <path d="M784 198 L810 176" stroke="#0A1220" stroke-width="6" stroke-linecap="round"/>
    <path d="M784 198 L810 176" stroke="#E4572E" stroke-width="3" stroke-linecap="round"/>
    <path d="M806 179 L818 169" stroke="#FFD166" stroke-width="3" stroke-linecap="round"/>
    <circle cx="820" cy="167" r="3" fill="#FF6B35"/>
    <circle cx="812" cy="174" r="6" fill="#FFD9B8" stroke="#0A1220" stroke-width="2"/>

    <!-- left hand -->
    <path d="M736 198 L712 178" stroke="#0A1220" stroke-width="6" stroke-linecap="round"/>
    <path d="M736 198 L712 178" stroke="#E4572E" stroke-width="3" stroke-linecap="round"/>
    <circle cx="709" cy="175" r="6" fill="#FFD9B8" stroke="#0A1220" stroke-width="2"/>

    <!-- body -->
    <rect x="734" y="182" width="52" height="56" rx="17" fill="#E4572E" stroke="#0A1220" stroke-width="3"/>
    <rect x="734" y="182" width="52" height="56" rx="17" fill="none" stroke="#FF8F6B" stroke-width="1.5" opacity="0.7"/>
    <circle cx="760" cy="212" r="10" fill="#0B1220"/>
    <text x="760" y="217" font-size="13" font-weight="900" fill="#4DE1FF" text-anchor="middle" class="latin">R</text>

    <!-- bow tie -->
    <path d="M752 184 L738 177 L738 191 Z" fill="#FF6B35" stroke="#0A1220" stroke-width="1.5"/>
    <path d="M768 184 L782 177 L782 191 Z" fill="#FF6B35" stroke="#0A1220" stroke-width="1.5"/>
    <circle cx="760" cy="184" r="4" fill="#FFD166" stroke="#0A1220" stroke-width="1.5"/>

    <!-- head -->
    <circle cx="760" cy="153" r="31" fill="#FFD9B8" stroke="#0A1220" stroke-width="3"/>
    <!-- hair -->
    <path d="M729 151 Q729 118 760 118 Q791 118 791 151 Q779 136 760 136 Q741 136 729 151 Z" fill="#101826"/>
    <!-- headset dot -->
    <path d="M760 123 L770 108" stroke="#4DE1FF" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="772" cy="106" r="4" fill="#4DE1FF"/>
    <circle cx="772" cy="106" r="8" fill="#4DE1FF" opacity="0.18"/>
    <!-- face -->
    <circle cx="749" cy="155" r="3.2" fill="#0A1220"/>
    <circle cx="771" cy="155" r="3.2" fill="#0A1220"/>
    <circle cx="750" cy="154" r="1" fill="#9FE9FF"/>
    <circle cx="772" cy="154" r="1" fill="#9FE9FF"/>
    <path d="M751 165 Q760 172 769 165" fill="none" stroke="#0A1220" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="741" cy="163" r="4" fill="#FF9B8A" opacity="0.5"/>
    <circle cx="779" cy="163" r="4" fill="#FF9B8A" opacity="0.5"/>
  </g>

  <!-- speech bubble -->
  <g>
    <rect x="782" y="58" width="104" height="36" rx="8" fill="#0B1626" stroke="#4DE1FF" stroke-width="2"/>
    <path d="M802 94 L778 116 L820 94 Z" fill="#0B1626" stroke="#4DE1FF" stroke-width="2"/>
    <rect x="796" y="94" width="16" height="4" fill="#0B1626"/>
    <text x="834" y="81" font-size="12" font-weight="700" fill="#9FE9FF" text-anchor="middle" class="mono">&gt; 记下了…</text>
  </g>

  <!-- TTL timer -->
  <g>
    <circle cx="848" cy="156" r="34" fill="none" stroke="#4DE1FF" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.5"/>
    <circle cx="848" cy="156" r="26" fill="#0B1626" stroke="#4DE1FF" stroke-width="2.5"/>
    <path d="M848 134 A 22 22 0 1 1 827 158" fill="none" stroke="#FF6B35" stroke-width="4" stroke-linecap="round"/>
    <text x="848" y="153" font-size="10" font-weight="700" fill="#8FE3FF" text-anchor="middle" class="mono">TTL</text>
    <text x="848" y="166" font-size="11" font-weight="800" fill="#FFF3E8" text-anchor="middle" class="mono">60s</text>
    <text x="848" y="206" font-size="12" font-weight="700" fill="#4DE1FF" text-anchor="middle">会失忆</text>
  </g>

  <!-- sparkles -->
  <g stroke="#4DE1FF" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
    <path d="M508 230 L508 244 M501 237 L515 237"/>
    <path d="M868 284 L868 298 M861 291 L875 291"/>
  </g>
  <g stroke="#FF6B35" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
    <path d="M486 196 L486 208 M480 202 L492 202"/>
  </g>
</svg>
</body>
</html>
