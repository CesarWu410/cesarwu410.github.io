<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Kafka Cover — Neo Brutalism</title>
<style>
  html, body { margin: 0; padding: 0; width: 900px; height: 383px; overflow: hidden; background: #F7F1E3; }
  svg { display: block; width: 900px; height: 383px; }
  text { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
  .black { font-family: "Arial Black", "Microsoft YaHei", sans-serif; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="383" viewBox="0 0 900 383">
  <defs>
    <pattern id="stripes" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="14" fill="#111111"/>
    </pattern>
  </defs>

  <!-- paper -->
  <rect width="900" height="383" fill="#F7F1E3"/>
  <rect x="0" y="0" width="900" height="383" fill="none" stroke="#111111" stroke-width="12"/>

  <!-- background graphics -->
  <text x="760" y="352" class="black" font-size="190" fill="none" stroke="#111111" stroke-width="3" opacity="0.08">01</text>
  <rect x="748" y="0" width="140" height="86" fill="url(#stripes)" opacity="0.85"/>
  <circle cx="478" cy="70" r="32" fill="#3D8BFF"/>
  <path d="M446 70 L510 70 M478 38 L478 102" stroke="#111111" stroke-width="7" stroke-linecap="round"/>
  <circle cx="478" cy="70" r="10" fill="#F7F1E3" stroke="#111111" stroke-width="5"/>

  <!-- badge -->
  <rect x="48" y="36" width="220" height="38" fill="#111111"/>
  <text x="66" y="62" font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">AI 项目经理视角 · 技术科普</text>

  <!-- title -->
  <text x="50" y="198" class="black" font-size="104" fill="#FF4D3D" letter-spacing="1">KAFKA</text>
  <text x="40" y="188" class="black" font-size="104" fill="#111111" letter-spacing="1">KAFKA</text>

  <!-- not-equal badge -->
  <g transform="rotate(8 448 122)">
    <circle cx="448" cy="122" r="32" fill="#F7F1E3" stroke="#111111" stroke-width="7"/>
    <text x="448" y="139" class="black" font-size="42" fill="#FF4D3D" text-anchor="middle">≠</text>
  </g>

  <!-- subtitle block -->
  <rect x="48" y="208" width="312" height="62" fill="#111111" transform="rotate(-2 54 210)"/>
  <text x="64" y="250" font-size="34" font-weight="900" fill="#FFFFFF" letter-spacing="1" transform="rotate(-2 54 210)">不是卡夫卡</text>

  <!-- tagline -->
  <text x="48" y="300" font-size="21" font-weight="800" fill="#111111" letter-spacing="0.5">一条会倒带的数据传送带</text>

  <!-- chips -->
  <g>
    <rect x="52" y="322" width="76" height="34" fill="#111111"/>
    <rect x="48" y="318" width="76" height="34" fill="#FFD23F" stroke="#111111" stroke-width="4"/>
    <text x="86" y="342" font-size="16" font-weight="900" fill="#111111" text-anchor="middle">解耦</text>

    <rect x="140" y="322" width="76" height="34" fill="#111111"/>
    <rect x="136" y="318" width="76" height="34" fill="#3D8BFF" stroke="#111111" stroke-width="4"/>
    <text x="174" y="342" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">削峰</text>

    <rect x="228" y="322" width="76" height="34" fill="#111111"/>
    <rect x="224" y="318" width="76" height="34" fill="#FF8FB1" stroke="#111111" stroke-width="4"/>
    <text x="262" y="342" font-size="16" font-weight="900" fill="#111111" text-anchor="middle">回放</text>
  </g>

  <!-- brand -->
  <text x="48" y="366" font-size="12" font-weight="700" fill="#111111" letter-spacing="1">黑胶先生 · 把技术讲成人话</text>

  <!-- ================= illustration ================= -->

  <!-- character behind boxes -->
  <g>
    <!-- body -->
    <rect x="642" y="180" width="56" height="62" rx="4" fill="#FF4D3D" stroke="#111111" stroke-width="6"/>
    <circle cx="670" cy="206" r="12" fill="#FFFFFF" stroke="#111111" stroke-width="4"/>
    <text x="670" y="212" class="black" font-size="14" fill="#111111" text-anchor="middle">K</text>
    <!-- head -->
    <circle cx="670" cy="148" r="34" fill="#FFD9B8" stroke="#111111" stroke-width="6"/>
    <path d="M636 146 Q636 110 670 110 Q704 110 704 146 Q690 130 670 130 Q650 130 636 146 Z" fill="#111111"/>
    <circle cx="658" cy="151" r="4" fill="#111111"/>
    <circle cx="682" cy="151" r="4" fill="#111111"/>
    <path d="M659 164 Q670 173 681 164" fill="none" stroke="#111111" stroke-width="4" stroke-linecap="round"/>
    <circle cx="648" cy="161" r="5" fill="#FF8F8F" opacity="0.6"/>
    <circle cx="692" cy="161" r="5" fill="#FF8F8F" opacity="0.6"/>
  </g>

  <!-- boxes -->
  <g>
    <rect x="508" y="216" width="86" height="76" fill="#111111"/>
    <rect x="500" y="208" width="86" height="76" fill="#FFD23F" stroke="#111111" stroke-width="7"/>
    <text x="543" y="242" font-size="21" font-weight="900" fill="#111111" text-anchor="middle">订单</text>
    <g stroke="#111111" stroke-width="4" stroke-linecap="round">
      <path d="M518 256 L568 256"/><path d="M518 266 L552 266"/>
    </g>

    <rect x="618" y="202" width="86" height="76" fill="#111111"/>
    <rect x="610" y="194" width="86" height="76" fill="#3D8BFF" stroke="#111111" stroke-width="7"/>
    <text x="653" y="228" font-size="21" font-weight="900" fill="#FFFFFF" text-anchor="middle">日志</text>
    <g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round">
      <path d="M628 242 L678 242"/><path d="M628 252 L662 252"/>
    </g>

    <rect x="728" y="216" width="86" height="76" fill="#111111"/>
    <rect x="720" y="208" width="86" height="76" fill="#FF8FB1" stroke="#111111" stroke-width="7"/>
    <text x="763" y="242" font-size="21" font-weight="900" fill="#111111" text-anchor="middle">事件</text>
    <g stroke="#111111" stroke-width="4" stroke-linecap="round">
      <path d="M738 256 L788 256"/><path d="M738 266 L772 266"/>
    </g>
  </g>

  <!-- arms in front -->
  <g>
    <path d="M644 198 L616 174" stroke="#111111" stroke-width="9" stroke-linecap="round"/>
    <circle cx="613" cy="171" r="8" fill="#FFD9B8" stroke="#111111" stroke-width="4"/>
    <path d="M696 198 L724 170" stroke="#111111" stroke-width="9" stroke-linecap="round"/>
    <circle cx="727" cy="167" r="8" fill="#FFD9B8" stroke="#111111" stroke-width="4"/>
  </g>

  <!-- belt -->
  <g>
    <rect x="480" y="302" width="410" height="48" rx="2" fill="#111111"/>
    <rect x="470" y="292" width="410" height="48" rx="2" fill="#FFD23F" stroke="#111111" stroke-width="8"/>
    <rect x="482" y="302" width="386" height="8" fill="#FF4D3D"/>
    <g fill="#FFFFFF" stroke="#111111" stroke-width="6">
      <circle cx="510" cy="342" r="15"/><circle cx="590" cy="342" r="15"/>
      <circle cx="670" cy="342" r="15"/><circle cx="750" cy="342" r="15"/>
      <circle cx="830" cy="342" r="15"/>
    </g>
    <g fill="#111111">
      <circle cx="510" cy="342" r="4"/><circle cx="590" cy="342" r="4"/>
      <circle cx="670" cy="342" r="4"/><circle cx="750" cy="342" r="4"/>
      <circle cx="830" cy="342" r="4"/>
    </g>
    <rect x="510" y="352" width="14" height="22" fill="#111111"/>
    <rect x="826" y="352" width="14" height="22" fill="#111111"/>
  </g>

  <!-- speech bubble -->
  <g>
    <rect x="710" y="84" width="128" height="52" fill="#111111"/>
    <rect x="702" y="76" width="128" height="52" fill="#FFFFFF" stroke="#111111" stroke-width="6"/>
    <polygon points="744,128 724,148 770,128" fill="#FFFFFF" stroke="#111111" stroke-width="6"/>
    <rect x="730" y="126" width="24" height="6" fill="#FFFFFF"/>
    <text x="766" y="109" font-size="17" font-weight="900" fill="#111111" text-anchor="middle">排队中！</text>
  </g>

  <!-- replay -->
  <g>
    <path d="M846 230 A 25 25 0 1 1 864 252" fill="none" stroke="#111111" stroke-width="7" stroke-linecap="round"/>
    <path d="M864 252 L874 235 L853 234 Z" fill="#FF4D3D" stroke="#111111" stroke-width="2"/>
    <rect x="812" y="184" width="82" height="26" fill="#111111" transform="rotate(2 822 188)"/>
    <rect x="808" y="180" width="82" height="26" fill="#FFFFFF" stroke="#111111" stroke-width="4" transform="rotate(2 822 188)"/>
    <text x="849" y="199" font-size="13" font-weight="900" fill="#111111" text-anchor="middle" transform="rotate(2 822 188)">可回放</text>
  </g>

  <!-- accents -->
  <g fill="#111111">
    <path d="M492 120 L492 136 L476 128 Z"/>
    <circle cx="860" cy="300" r="9"/>
  </g>
  <path d="M760 360 L790 360 M780 350 L790 360 L780 370" fill="none" stroke="#111111" stroke-width="4" stroke-linecap="round"/>
</svg>
</body>
</html>
